name: Darvas AI Daily Scan

on:
  schedule:
    - cron: '45 3 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install libraries
        run: pip install yfinance pandas numpy scikit-learn google-api-python-client google-auth

      - name: Run Darvas AI
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: python daily_runner.py

      - name: Save signals to repo
        run: |
          git config user.name "Darvas AI"
          git config user.email "darvas@ai.com"
          mkdir -p signals
          cp output/latest_signals.json signals/latest_signals.json
          git add signals/latest_signals.json
          git commit -m "Signals update $(date +%Y-%m-%d)" || echo "No changes"
          git push

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: darvas-signals
          path: output/
          retention-days: 30
